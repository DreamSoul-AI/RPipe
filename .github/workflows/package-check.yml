name: Package Check

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  plan:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.plan.outputs.package }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - id: plan
        name: Select checks and verify prior evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/ci.py plan --kind package
      - name: Retain selection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rpipe-ci/plan.json
          if-no-files-found: error
          retention-days: 7

  build-package:
    needs: plan
    if: needs.plan.outputs.package == 'true'
    name: Build package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Prepare evidence directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rpipe-package-evidence"
          echo "RPIPE_PACKAGE_EVIDENCE_ROOT=$RUNNER_TEMP/rpipe-package-evidence" >> "$GITHUB_ENV"

      - name: Install build frontend
        shell: bash
        run: python -m pip install --upgrade build 2>&1 | tee "$RPIPE_PACKAGE_EVIDENCE_ROOT/build-frontend.log"

      - name: Build wheel and source distribution
        shell: bash
        run: python -m build 2>&1 | tee "$RPIPE_PACKAGE_EVIDENCE_ROOT/build.log"

      - name: Verify installed wheel CLI and CPU workflow
        shell: bash
        run: |
          python -m venv .tmp/wheel-env
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            package_python="$PWD/.tmp/wheel-env/Scripts/python.exe"
          else
            package_python="$PWD/.tmp/wheel-env/bin/python"
          fi
          "$package_python" -m pip install pip==26.2.2 2>&1 | tee "$RPIPE_PACKAGE_EVIDENCE_ROOT/wheel-pip.log"
          "$package_python" -m pip install dist/*.whl 2>&1 | tee "$RPIPE_PACKAGE_EVIDENCE_ROOT/wheel-install.log"
          "$package_python" tests/package_smoke.py --artifact dist/*.whl --workspace "$RUNNER_TEMP/rpipe-wheel-smoke" 2>&1 | tee "$RPIPE_PACKAGE_EVIDENCE_ROOT/wheel-smoke.log"

      - name: Verify source distribution installation and CLI
        shell: bash
        run: |
          python -m venv .tmp/sdist-env
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            package_python="$PWD/.tmp/sdist-env/Scripts/python.exe"
          else
            package_python="$PWD/.tmp/sdist-env/bin/python"
          fi
          "$package_python" -m pip install pip==26.2.2 2>&1 | tee "$RPIPE_PACKAGE_EVIDENCE_ROOT/sdist-pip.log"
          "$package_python" -m pip install dist/*.tar.gz 2>&1 | tee "$RPIPE_PACKAGE_EVIDENCE_ROOT/sdist-install.log"
          "$package_python" tests/package_smoke.py --artifact dist/*.tar.gz --workspace "$RUNNER_TEMP/rpipe-sdist-smoke" 2>&1 | tee "$RPIPE_PACKAGE_EVIDENCE_ROOT/sdist-smoke.log"

      - name: Upload package check evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: package-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rpipe-package-evidence/
            ${{ runner.temp }}/rpipe-wheel-smoke/
            ${{ runner.temp }}/rpipe-sdist-smoke/
          if-no-files-found: error
          retention-days: 7

  package-gate:
    name: Build package
    needs: [plan, build-package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Require selected checks and bind success to the tested tree
        env:
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
          PLAN_RESULT: ${{ needs.plan.result }}
          JOB_RESULT: ${{ needs.build-package.result }}
        run: python tests/ci.py gate --kind package
      - name: Retain successful validation receipt
        uses: actions/upload-artifact@v7
        with:
          name: rpipe-package-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rpipe-ci/receipt.json
          if-no-files-found: error
          retention-days: 7
