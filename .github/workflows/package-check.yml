name: Package Check
permissions:
  contents: read
env:
  MPLBACKEND: Agg
jobs:
  build-package:
    name: Build package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
    - name: Prepare evidence directory
      shell: bash
      run: 'mkdir -p "$RUNNER_TEMP/rpipe-package-evidence"

        echo "RPIPE_PACKAGE_EVIDENCE_ROOT=$RUNNER_TEMP/rpipe-package-evidence" >> "$GITHUB_ENV"

        '
    - name: Install build frontend
      shell: bash
      run: python -c "print('controlled pre-build failure'); raise SystemExit(9)" 2>&1 | tee "$RPIPE_PACKAGE_EVIDENCE_ROOT/build-frontend.log"
    - name: Build wheel and source distribution
      shell: bash
      run: python -m build 2>&1 | tee "$RPIPE_PACKAGE_EVIDENCE_ROOT/build.log"
    - name: Verify installed wheel CLI and CPU workflow
      shell: bash
      run: "python -m venv .tmp/wheel-env\nif [[ \"$RUNNER_OS\" == \"Windows\" ]]; then\n  package_python=\"$PWD/.tmp/wheel-env/Scripts/python.exe\"\nelse\n  package_python=\"$PWD/.tmp/wheel-env/bin/python\"\
        \nfi\n\"$package_python\" -m pip install dist/*.whl 2>&1 | tee \"$RPIPE_PACKAGE_EVIDENCE_ROOT/wheel-install.log\"\n\"$package_python\" tests/package_smoke.py --workspace \"$RUNNER_TEMP/rpipe-wheel-smoke\"\
        \ 2>&1 | tee \"$RPIPE_PACKAGE_EVIDENCE_ROOT/wheel-smoke.log\"\n"
    - name: Verify source distribution installation and CLI
      shell: bash
      run: "python -m venv .tmp/sdist-env\nif [[ \"$RUNNER_OS\" == \"Windows\" ]]; then\n  package_python=\"$PWD/.tmp/sdist-env/Scripts/python.exe\"\nelse\n  package_python=\"$PWD/.tmp/sdist-env/bin/python\"\
        \nfi\n\"$package_python\" -m pip install dist/*.tar.gz 2>&1 | tee \"$RPIPE_PACKAGE_EVIDENCE_ROOT/sdist-install.log\"\n\"$package_python\" tests/package_smoke.py --workspace \"\
        $RUNNER_TEMP/rpipe-sdist-smoke\" 2>&1 | tee \"$RPIPE_PACKAGE_EVIDENCE_ROOT/sdist-smoke.log\"\n"
    - name: Upload package check evidence
      if: always()
      timeout-minutes: 5
      uses: actions/upload-artifact@v7
      with:
        name: package-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        path: '${{ runner.temp }}/rpipe-package-evidence/

          ${{ runner.temp }}/rpipe-wheel-smoke/

          ${{ runner.temp }}/rpipe-sdist-smoke/

          '
        if-no-files-found: error
        retention-days: 7
  package-gate:
    name: Build package
    needs: build-package
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Require every distribution matrix job to succeed
      run: test "${{ needs.build-package.result }}" = success
'on':
  push:
    branches:
    - codex/ci-evidence-probe-20261027
