name: Unit Tests

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

env:
  MPLBACKEND: Agg

jobs:
  unit:
    name: CPU tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and pytest
        run: python -m pip install -e ".[dev,tensorboard]" "huggingface_hub==1.33.0" "datasets==5.0.0" "httpx==0.28.1" requests aiohttp Pillow

      - name: Run core unit tests
        run: python tests/run.py --core

      - name: Run native CPU integration and end-to-end flows
        run: >-
          python tests/run.py --all --cost-class c1 --cost-class c2 --
          -m "(integration or e2e) and not external and not gpu and not slow"

      - name: Read back optional TensorBoard events (CPU, offline)
        run: >-
          python tests/run.py --all --cost-class c1 --
          tests/rpipe/flow/test_exports.py -k tensorboard_real_event_roundtrip

  unit-gate:
    name: Unit tests
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every CPU matrix job to succeed
        run: test "${{ needs.unit.result }}" = success
