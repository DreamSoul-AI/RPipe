# study.yaml — copy studies/_template/ → studies/<your_study>/
# 对照根 README.md 的“Study 使用与执行边界”。格子由 make 展开，不要手写 runs/。

study: my_study
origin: domestic              # foreign：官方数据与 Hugging Face；domestic：国内镜像。Study 只定一次
description: one-line research question

experiment:
  name: mnist_linear   # 给人看的基底名，不是磁盘路径

fixed:
  data:
    name: MNIST
    source: torch
    config:
      batch_size: 64
  model:
    name: linear
  algorithm:
    source: custom_torch
    mode: train
    num_epochs: 20
    progress_unit: epoch
    eval_period: 1
    checkpoint: latest
    checkpoint_period: 1
    save_best: true
    optimizer: SGD
    max_grad_norm: 0
    lr: 0.1
    scheduler: cosine
    eta_min: 0.0
  system:
    device: cuda
    deterministic: false
    cudnn_benchmark: true

# 每个取值组合 = 一个 Experiment。seed 不要放这里。
# 有独立 eval 时写上 algorithm.mode；make 会先跑完全部 train 再 eval。
axes:
  data.config.train_size: [500, 2000, 8000]
  algorithm.mode: [train, eval]

# 每个 Experiment × 每个 seed = 一次 Run。这是复测次数，不是并发。
seeds: [0, 1, 2]

tags:
  - when:
      data.config.train_size: 500
      algorithm.mode: train
    tags: [baseline]

run_description: "train_size={train_size} mode={mode} seed={seed}"
