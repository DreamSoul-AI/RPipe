study: main_probe
origin: foreign
description: Paired original/current 60-step numerical probe; one data/model pair
  per Flow Run
experiment:
  name: main_probe
fixed:
  version: main-probe-rpipe-refactor-20261021
  data:
    source: main_probe
    config:
      batch_size: 250
      test_batch_ratio: 4
      pin_memory: true
      num_workers: 0
      augment: true
  algorithm:
    source: main_probe
    mode: train
    num_steps: 60
    progress_unit: step
    eval_period: 30
    eval_num_steps: -1
    log_period: 30
    checkpoint: latest
    checkpoint_period: 30
    save_best: true
    best_metric: Loss
    best_mode: min
    best_split: test
    optimizer: SGD
    lr: 0.1
    momentum: 0.9
    nesterov: true
    weight_decay: 0.0005
    max_grad_norm: 0.0
    scheduler: cosine
    T_max: 60
    eta_min: 0.0
    resume: false
  system:
    device: cuda
    deterministic: true
    cudnn_benchmark: false
    cudnn_allow_tf32: false
    matmul_allow_tf32: false
    config:
      vram_bytes: 5368709120
  model:
    source: custom_torch
axes:
  data.name:
  - MNIST
  - CIFAR10
  model.name:
  - linear
  - mlp
  - cnn
  - resnet18
seeds:
- 0
tags:
- when:
    data.name: MNIST
    model.name: linear
  tags:
  - baseline
run_description: data={data_name} model={model_name} mode={mode} seed={seed}
recipe: recipe.py
provenance:
  inputs:
  - path: ../main_exp/docs/EXPECTED_DATA.json
    sha256: d0889ffe5da16f2f9e06253490eaf58b22bf3a0468fd96664cf147fe60708844
flow:
  study_phases: true
